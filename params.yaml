data:
  raw_path: data/raw/fish_catch_data_turkey.csv
  processed_path: data/processed/fish_processed.csv
  test_size: 0.2
  random_state: 42

features:
  price_target: Price.TL
  catch_target: Production.Volume.tonnes
  categorical_cols:
    - Species
    - Fishing.Area
  drop_cols:
    - Price.TL
    - Production.Volume.tonnes

models:
  random_state: 42
  rf_n_estimators: 100
  rf_max_depth: 8
  xgb_n_estimators: 100
  xgb_max_depth: 6
  xgb_learning_rate: 0.1

mlflow:
  tracking_uri: http://localhost:5000
  price_experiment: FishCast_PriceModel
  catch_experiment: FishCast_CatchModel
